<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Daily Budget">
  <defs>
    <linearGradient id="brand-maskable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <!-- Full bleed: a maskable icon is cropped to whatever shape the launcher uses. -->
  <rect width="512" height="512" fill="url(#brand-maskable)" />
  <!-- The glyph stays inside the 80% safe zone so no crop can clip it. -->
  <text
    x="256"
    y="260"
    fill="#ffffff"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="200"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >¹</text>
</svg>
